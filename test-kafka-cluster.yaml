# Simple single-node Kafka cluster for testing the Headlamp plugin
# This uses KRaft mode (ZooKeeper-less) with ephemeral storage
# 
# Usage:
#   1. Make sure Strimzi Cluster Operator is installed
#   2. kubectl apply -f test-kafka-cluster.yaml
#   3. Wait for cluster to be ready: kubectl wait kafka/test-cluster --for=condition=Ready --timeout=300s
#   4. Check in Headlamp plugin: Strimzi -> Kafka Clusters

apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: test-node
  labels:
    strimzi.io/cluster: test-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: test-cluster
  namespace: default
spec:
  kafka:
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
